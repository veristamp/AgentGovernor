# NsJail Configuration for Governed Code Mode
# 
# This config creates a minimal, secure sandbox for executing LLM-generated Python code.
# The ONLY I/O allowed is via Unix socket to MCPClientManager.

name: "workflow-sandbox"
description: "Secure sandbox for LLM-generated Python workflows"

mode: ONCE
hostname: "sandbox"
cwd: "/workspace"

# Time limits
time_limit: 60        # Wall-clock timeout (seconds)
max_cpus: 1           # Limit to 1 CPU

# Resource limits
rlimit_as_type: SOFT
rlimit_as: 512        # Address space limit (MB)

rlimit_cpu_type: SOFT
rlimit_cpu: 10        # CPU time limit (seconds)

rlimit_fsize_type: SOFT
rlimit_fsize: 10      # Max file size (MB)

rlimit_nofile_type: SOFT
rlimit_nofile: 64     # Max open files

# Namespace isolation (maximum isolation)
clone_newnet: true    # Network namespace (NO network access)
clone_newpid: true    # PID namespace
clone_newns: true     # Mount namespace
clone_newipc: true    # IPC namespace
clone_newuts: true    # UTS namespace (hostname)
clone_newuser: true   # User namespace
clone_newcgroup: true # Cgroup namespace

# User mapping (run as unprivileged user)
uidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
}

gidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
}

# ==================== FILESYSTEM ====================
# Minimal read-only mounts for Python execution

# Python interpreter and standard library
mount {
  src: "/usr/bin/python3"
  dst: "/usr/bin/python3"
  is_bind: true
  rw: false
}

mount {
  src: "/usr/lib/python3"
  dst: "/usr/lib/python3"
  is_bind: true
  rw: false
}

mount {
  src: "/usr/lib/python3.11"
  dst: "/usr/lib/python3.11"
  is_bind: true
  rw: false
  mandatory: false
}

mount {
  src: "/usr/lib/python3.12"
  dst: "/usr/lib/python3.12"
  is_bind: true
  rw: false
  mandatory: false
}

# System libraries (required for Python)
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}

mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  mandatory: false
}

mount {
  src: "/usr/lib"
  dst: "/usr/lib"
  is_bind: true
  rw: false
}

# Our MCP runtime (read-only)
mount {
  src: "/runtime"
  dst: "/runtime"
  is_bind: true
  rw: false
}

# Writable workspace (tmpfs - in memory only)
mount {
  dst: "/workspace"
  fstype: "tmpfs"
  rw: true
  options: "size=64m"
}

# Writable /tmp (tmpfs)
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=32m"
}

# Unix socket for MCP communication (ONLY I/O allowed)
# This is bind-mounted from host at runtime
mount {
  src: "/var/run/mcp/workflow.sock"
  dst: "/mcp.sock"
  is_bind: true
  rw: true
}

# ==================== SECCOMP ====================
# Only allow syscalls needed for Python + Unix socket

seccomp_string: "
POLICY python_socket {
  ALLOW {
    # Memory management
    mmap, mprotect, munmap, brk, mremap,
    
    # File operations (limited to allowed mounts)
    read, write, close, fstat, lseek, openat, newfstatat, fcntl,
    access, faccessat, faccessat2, readlink, readlinkat,
    getdents64, getcwd,
    
    # Process/thread
    getpid, getppid, getuid, getgid, geteuid, getegid,
    getgroups, gettid, set_tid_address,
    futex, exit_group, exit,
    rt_sigaction, rt_sigprocmask, rt_sigreturn,
    sigaltstack,
    
    # Socket operations (Unix socket only)
    socket, connect, sendto, recvfrom, send, recv,
    shutdown,
    
    # Misc
    ioctl, pipe, pipe2, dup, dup2, dup3,
    clock_gettime, clock_getres, gettimeofday,
    getrandom, getentropy,
    prctl, arch_prctl,
    set_robust_list, get_robust_list,
    rseq, prlimit64,
    sched_getaffinity, sched_yield
  }
}
USE python_socket DEFAULT KILL
"
