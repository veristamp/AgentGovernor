version: 1

vars:
  workdir: "./_wf_out"
  greeting: "hello-workflow"

steps:
  - log: "Starting workflow in ${workdir}"

  # Ensure directory exists
  - tool: filesystem.create_directory
    args:
      path: "${workdir}"

  # OS-specific command via IF (very simple branch using 'contains')
  - set:
      var: is_windows
      value: {"contains": [{"var": "env.OS"}, "Windows"]}
  - if: {"var": "is_windows"}
    then:
      - tool: terminal.run_command
        args: { command: "echo ${greeting}", directory: "~", timeout: 30 }
        save_as: echo_win
    else:
      - tool: terminal.run_command
        args: { command: "echo ${greeting}", directory: "~", timeout: 30 }
        save_as: echo_unix

  # Loop to create a few files
  - loop:
      var: fname
      over: ["a.txt", "b.txt", "c.txt"]
    do:
      - tool: filesystem.write_file
        args:
          path: "${workdir}/${fname}"
          content: "This is ${fname} — ${greeting}"
        save_as: write_result

  # List directory to verify
  - tool: filesystem.list_directory
    args:
      path: "${workdir}"
    save_as: dir_listing

  - log: "Workflow finished. Files in ${workdir} -> see last_output."
