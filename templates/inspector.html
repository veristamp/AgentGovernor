<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Inspector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background-color: #ffffff; min-height: 100vh; }
        .main-content { background-color: #ffffff; }
        .tool-card { transition: all 0.2s; cursor: pointer; }
        .tool-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .result-card { max-height: 400px; overflow-y: auto; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .json-input { font-family: 'Courier New', monospace; font-size: 0.9em; }
        .nav-tabs .nav-link.active { background-color: #007bff; color: white; }
        .execution-form { background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <!-- ==========================================
         SIDEBAR SECTION
         ========================================== -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar p-3">
                <!-- Sidebar Header -->
                <div class="d-flex align-items-center mb-4">
                    <span class="status-indicator status-connected"></span>
                    <h5 class="mb-0">🔧 MCP Inspector</h5>
                </div>

                <!-- Disconnect Button -->
                <div class="mb-3">
                    <button class="btn btn-outline-danger btn-sm w-100" onclick="disconnectServer()">
                        🔌 Disconnect Server
                    </button>
                </div>

                <!-- Navigation Tabs -->
                <ul class="nav nav-tabs flex-column" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active w-100 text-start" data-bs-toggle="tab" data-bs-target="#tools-tab">
                            🛠️ Tools
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#resources-tab">
                            📚 Resources
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#prompts-tab">
                            💬 Prompts
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="tools-tab">
                        <div id="toolsList" class="list-group list-group-flush">
                            <!-- Tools will be populated here -->
                        </div>
                    </div>
                    <div class="tab-pane fade" id="resources-tab">
                        <div id="resourcesList" class="list-group list-group-flush">
                            <!-- Resources will be populated here -->
                        </div>
                    </div>
                    <div class="tab-pane fade" id="prompts-tab">
                        <div id="promptsList" class="list-group list-group-flush">
                            <!-- Prompts will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==========================================
                 MAIN CONTENT SECTION
                 ========================================== -->
            <div class="col-md-9 main-content p-4">
                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 id="pageTitle">🛠️ MCP Inspector</h2>
                        {% if current_server %}
                        <p class="text-muted mb-0">Connected to: <strong>{{ current_server }}</strong></p>
                        {% endif %}
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary btn-sm me-2" onclick="window.location.href='/servers'">
                            🔄 Change Server
                        </button>
                        <button class="btn btn-outline-primary" onclick="refreshCapabilities()">
                            🔄 Refresh
                        </button>
                    </div>
                </div>

                <!-- Hidden capabilities data for JavaScript -->
                {% if capabilities %}<pre id="capabilities-data" style="display: none;">{{ capabilities }}</pre>{% endif %}

                <!-- ==========================================
                     EXECUTION FORM SECTION
                     ========================================== -->
                <div id="executionForm" class="execution-form" style="display: none;">
                    <h5 id="formTitle">Execute Tool</h5>
                    <form id="executeForm">
                        <input type="hidden" id="actionType" name="action_type">
                        <input type="hidden" id="actionName" name="action_name">

                        <div id="argumentsContainer">
                            <!-- Arguments will be populated here -->
                        </div>

                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-success">🚀 Execute</button>
                            <button type="button" class="btn btn-secondary" onclick="hideExecutionForm()">❌ Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- ==========================================
                     RESULTS SECTION
                     ========================================== -->
                <div id="resultsContainer">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="mb-0">📋 Results</h6>
                        </div>
                        <div class="card-body result-card">
                            <div id="resultsContent">
                                <p class="text-muted">Execute a tool to see results here...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT SECTION - CORE FUNCTIONALITY
         ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/plugins/json/prism-json.min.js"></script>

    <script>
        // ==========================================
        // GLOBAL STATE MANAGEMENT
        // ==========================================
        let currentCapabilities = '';
        let currentSchemas = {};

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.addEventListener('load', function() {
            loadCapabilities();
        });

        // ==========================================
        // CAPABILITIES AND SCHEMA MANAGEMENT
        // ==========================================
        async function loadCapabilities() {
            try {
                const capabilitiesElement = document.getElementById('capabilities-data');
                if (capabilitiesElement) {
                    currentCapabilities = capabilitiesElement.textContent;
                    parseAndDisplayCapabilities(currentCapabilities);
                } else {
                    console.error('Capabilities element not found');
                    document.getElementById('resultsContent').innerHTML =
                        '<div class="alert alert-warning">No capabilities data found</div>';
                    return;
                }

                await loadSchemas();
            } catch (error) {
                console.error('Failed to load capabilities:', error);
                document.getElementById('resultsContent').innerHTML =
                    '<div class="alert alert-danger">Failed to load capabilities: ' + error.message + '</div>';
            }
        }

        async function loadSchemas() {
            try {
                const response = await fetch('/schemas');
                const data = await response.json();

                if (data.error) {
                    console.error('Error loading schemas:', data.error);
                    return;
                }

                currentSchemas = data.schemas;
            } catch (error) {
                console.error('Failed to load schemas:', error);
            }
        }

        // ==========================================
        // UI DISPLAY FUNCTIONS
        // ==========================================
        function parseAndDisplayCapabilities(capabilities) {
            const lines = capabilities.split('\n');
            const toolsList = document.getElementById('toolsList');
            const resourcesList = document.getElementById('resourcesList');
            const promptsList = document.getElementById('promptsList');

            let currentSection = '';
            let items = [];

            for (const line of lines) {
                if (line.startsWith('Tools:')) {
                    currentSection = 'tools';
                    items = [];
                } else if (line.startsWith('Resources:')) {
                    displayItems('tools', items, toolsList);
                    currentSection = 'resources';
                    items = [];
                } else if (line.startsWith('Prompts:')) {
                    displayItems('resources', items, resourcesList);
                    currentSection = 'prompts';
                    items = [];
                } else if (line.trim() && currentSection && line.startsWith('  ')) {
                    items.push(line.trim());
                }
            }

            displayItems(currentSection, items, currentSection === 'tools' ? toolsList :
                                               currentSection === 'resources' ? resourcesList : promptsList);
        }

        function displayItems(section, items, container) {
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p class="text-muted">No items available</p>';
                return;
            }

            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-group-item list-group-item-action tool-card';
                itemDiv.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1">${item.split(':')[0]}</h6>
                        <small>Click to use</small>
                    </div>
                    <p class="mb-1">${item.split(':').slice(1).join(':').trim()}</p>
                `;

                itemDiv.addEventListener('click', () => {
                    showExecutionForm(section, item.split(':')[0].trim(), item);
                });

                container.appendChild(itemDiv);
            });
        }

        // ==========================================
        // FORM GENERATION AND MANAGEMENT
        // ==========================================
        function showExecutionForm(actionType, actionName, itemInfo) {
            // Map plural forms to singular forms for backend compatibility
            const singularActionType = actionType.endsWith('s') ? actionType.slice(0, -1) : actionType;

            document.getElementById('actionType').value = singularActionType;
            document.getElementById('actionName').value = actionName;
            document.getElementById('formTitle').textContent = `Execute ${actionType}: ${actionName}`;
            document.getElementById('executionForm').style.display = 'block';

            // Generate argument form based on schema or fallback to parsing
            if (currentSchemas && currentSchemas["tools"] && currentSchemas["tools"][actionName]) {
                generateArgumentFormFromSchema("tools", actionName);
            } else if (currentSchemas && currentSchemas["resources"] && currentSchemas["resources"][actionName]) {
                generateArgumentFormFromSchema("resources", actionName);
            } else if (currentSchemas && currentSchemas["prompts"] && currentSchemas["prompts"][actionName]) {
                generateArgumentFormFromSchema("prompts", actionName);
            } else {
                generateArgumentForm(itemInfo);
            }
        }

        function generateArgumentFormFromSchema(schemaType, actionName) {
            const container = document.getElementById('argumentsContainer');
            container.innerHTML = '';

            const schema = currentSchemas[schemaType][actionName];

            if (schemaType === "tools" && (!schema.inputSchema || !schema.inputSchema.properties)) {
                container.innerHTML = '<p class="text-muted">No parameters required</p>';
                return;
            }

            if (schemaType === "tools") {
                const properties = schema.inputSchema.properties;
                const required = schema.inputSchema.required || [];

                for (const [paramName, paramSchema] of Object.entries(properties)) {
                    const isRequired = required.includes(paramName);
                    const formGroup = createFormField(paramName, paramSchema, isRequired);
                    container.appendChild(formGroup);
                }
            } else {
                container.innerHTML = '<p class="text-muted">No parameters required for this item</p>';
            }
        }

        function createFormField(paramName, paramSchema, isRequired) {
            const formGroup = document.createElement('div');
            formGroup.className = 'mb-3';

            const label = document.createElement('label');
            label.className = 'form-label';
            label.textContent = `${paramName} ${isRequired ? '*' : '(optional)'}`;

            if (paramSchema.description) {
                label.title = paramSchema.description;
            }

            let input;

            switch (paramSchema.type) {
                case 'boolean':
                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.className = 'form-check-input';
                    input.name = paramName;
                    input.checked = paramSchema.default || false;

                    const checkboxWrapper = document.createElement('div');
                    checkboxWrapper.className = 'form-check';
                    checkboxWrapper.appendChild(input);
                    checkboxWrapper.appendChild(label);
                    formGroup.appendChild(checkboxWrapper);
                    break;

                case 'array':
                    input = document.createElement('textarea');
                    input.className = 'form-control';
                    input.name = paramName;
                    input.rows = 3;
                    input.placeholder = 'Enter JSON array, e.g., ["item1", "item2"]';
                    if (paramSchema.default) {
                        input.value = JSON.stringify(paramSchema.default, null, 2);
                    }
                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                    break;

                case 'object':
                    input = document.createElement('textarea');
                    input.className = 'form-control';
                    input.name = paramName;
                    input.rows = 4;
                    input.placeholder = 'Enter JSON object';
                    if (paramSchema.default) {
                        input.value = JSON.stringify(paramSchema.default, null, 2);
                    }
                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                    break;

                case 'number':
                case 'integer':
                    input = document.createElement('input');
                    input.type = 'number';
                    input.className = 'form-control';
                    input.name = paramName;
                    input.step = paramSchema.type === 'integer' ? '1' : 'any';
                    if (paramSchema.minimum !== undefined) {
                        input.min = paramSchema.minimum;
                    }
                    if (paramSchema.maximum !== undefined) {
                        input.max = paramSchema.maximum;
                    }
                    if (paramSchema.default !== undefined) {
                        input.value = paramSchema.default;
                    }
                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                    break;

                default: // string and others
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.name = paramName;
                    if (paramSchema.default) {
                        input.value = paramSchema.default;
                    }
                    if (paramSchema.format === 'textarea') {
                        input = document.createElement('textarea');
                        input.className = 'form-control';
                        input.name = paramName;
                        input.rows = 3;
                        if (paramSchema.default) {
                            input.value = paramSchema.default;
                        }
                    }
                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
            }

            if (input && input.type !== 'checkbox') {
                input.required = isRequired;
            }

            return formGroup;
        }

        function generateArgumentForm(itemInfo) {
            const container = document.getElementById('argumentsContainer');
            container.innerHTML = '';

            // Extract arguments from item info (simple parsing)
            const argsMatch = itemInfo.match(/\[Args: (.+?)\]/);
            if (argsMatch) {
                const argsText = argsMatch[1];
                const args = argsText.split(', ');

                args.forEach(arg => {
                    const argName = arg.split(' ')[0].replace(/\(|\)/g, '');
                    const argType = arg.match(/\((\w+)/) ? arg.match(/\((\w+)/)[1] : 'string';
                    const isRequired = arg.includes('req');

                    const formGroup = document.createElement('div');
                    formGroup.className = 'mb-3';

                    const label = document.createElement('label');
                    label.className = 'form-label';
                    label.textContent = `${argName} ${isRequired ? '*' : '(optional)'}`;

                    const input = document.createElement('input');
                    input.type = argType === 'boolean' ? 'checkbox' : 'text';
                    input.className = 'form-control';
                    input.name = argName;
                    input.required = isRequired;

                    if (argType === 'array') {
                        input.placeholder = 'Enter JSON array, e.g., ["item1", "item2"]';
                    }

                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                    container.appendChild(formGroup);
                });
            }
        }

        function hideExecutionForm() {
            document.getElementById('executionForm').style.display = 'none';
        }

        // ==========================================
        // FORM SUBMISSION AND EXECUTION
        // ==========================================
        document.getElementById('executeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const actionType = formData.get('action_type');
            const actionName = formData.get('action_name');

            // Build arguments object
            const args = {};
            for (const [key, value] of formData.entries()) {
                if (key !== 'action_type' && key !== 'action_name') {
                    const element = document.querySelector(`[name="${key}"]`);
                    if (element) {
                        if (element.type === 'checkbox') {
                            args[key] = element.checked;
                        } else if (element.tagName === 'TEXTAREA') {
                            try {
                                args[key] = JSON.parse(value);
                            } catch {
                                args[key] = value;
                            }
                        } else {
                            try {
                                args[key] = JSON.parse(value);
                            } catch {
                                args[key] = value;
                            }
                        }
                    }
                }
            }

            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = '<div class="alert alert-info">🔄 Executing...</div>';

            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action_type: actionType,
                        action_name: actionName,
                        arguments: JSON.stringify(args)
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    displayResult(result);
                } else {
                    resultsContent.innerHTML = `<div class="alert alert-danger">❌ Error: ${result.message}</div>`;
                }
            } catch (error) {
                resultsContent.innerHTML = `<div class="alert alert-danger">❌ Network error: ${error.message}</div>`;
            }
        });

        function displayResult(result) {
            const resultsContent = document.getElementById('resultsContent');

            // Format the result properly for display
            let formattedResult;
            if (typeof result.result === 'string') {
                formattedResult = result.result.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
            } else {
                formattedResult = JSON.stringify(result.result, null, 2);
            }

            let html = `
                <div class="alert alert-success">
                    <strong>✅ Execution Successful</strong><br>
                    <strong>Type:</strong> ${result.action_type}<br>
                    <strong>Name:</strong> ${result.action_name}
                </div>
                <div class="border rounded p-3 bg-light">
                    <strong>Result:</strong>
                    <pre><code class="language-json">${formattedResult}</code></pre>
                </div>
            `;

            resultsContent.innerHTML = html;

            if (window.Prism) {
                try {
                    Prism.highlightAll();
                } catch (e) {
                    console.log('Prism highlighting failed, but result displayed');
                }
            }
        }

        // ==========================================
        // SERVER MANAGEMENT
        // ==========================================
        async function disconnectServer() {
            try {
                await fetch('/disconnect', { method: 'POST' });
                window.location.reload();
            } catch (error) {
                alert('Failed to disconnect: ' + error.message);
            }
        }

        async function refreshCapabilities() {
            try {
                const response = await fetch('/capabilities');
                const data = await response.json();

                if (data.error) {
                    console.error('Error refreshing capabilities:', data.error);
                    document.getElementById('resultsContent').innerHTML =
                        '<div class="alert alert-danger">Error refreshing capabilities: ' + data.error + '</div>';
                    return;
                }

                currentCapabilities = data.capabilities;
                parseAndDisplayCapabilities(currentCapabilities);

                const capabilitiesElement = document.getElementById('capabilities-data');
                if (capabilitiesElement) {
                    capabilitiesElement.textContent = currentCapabilities;
                }

                await loadSchemas();

            } catch (error) {
                console.error('Failed to refresh capabilities:', error);
                document.getElementById('resultsContent').innerHTML =
                    '<div class="alert alert-danger">Failed to refresh capabilities: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
