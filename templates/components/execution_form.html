<div id="executionForm" class="execution-form" style="display: none;">
    <h5 id="formTitle">Execute Tool</h5>
    <form id="executeForm">
        <input type="hidden" id="actionType" name="action_type">
        <input type="hidden" id="actionName" name="action_name">

        <div id="argumentsContainer">
            <!-- Arguments will be populated here -->
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">🚀 Execute</button>
            <button type="button" class="btn btn-secondary" onclick="hideExecutionForm()">❌ Cancel</button>
        </div>
    </form>
</div>
