<div class="col-md-3 sidebar p-3">
    <!-- Sidebar Header -->
    <div class="d-flex align-items-center mb-4">
        <span class="status-indicator status-connected"></span>
        <h5 class="mb-0">🔧 MCP Inspector</h5>
    </div>

    <!-- Disconnect Button -->
    <div class="mb-3">
        <button class="btn btn-outline-danger btn-sm w-100" onclick="disconnectServer()">
            🔌 Disconnect Server
        </button>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs flex-column" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active w-100 text-start" data-bs-toggle="tab" data-bs-target="#tools-tab">
                🛠️ Tools
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#resources-tab">
                📚 Resources
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#prompts-tab">
                💬 Prompts
            </button>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="tools-tab">
            <div id="toolsList" class="list-group list-group-flush">
                <!-- Tools will be populated here -->
            </div>
        </div>
        <div class="tab-pane fade" id="resources-tab">
            <div id="resourcesList" class="list-group list-group-flush">
                <!-- Resources will be populated here -->
            </div>
        </div>
        <div class="tab-pane fade" id="prompts-tab">
            <div id="promptsList" class="list-group list-group-flush">
                <!-- Prompts will be populated here -->
            </div>
        </div>
    </div>
</div>
