description: "Analyze the mcp_client repo: get the folder tree, find connections for 'run_tool', and get the source code for the '_execute_single_step' function."
version: 1

vars:
  repo_path: "mcp_client"
  target_function: "_execute_single_step"
  target_path: "mcp_client/executioner.py"

# This workflow tests the 'modelcontextprotocol-python-sdk' tools.
# 'get_folder_tree' and 'get_function_code' run in parallel.
# 'final_log' waits for both to complete.
steps:

  get_folder_tree:
    tool: "modelcontextprotocol-python-sdk.folder-tree-structure"
    args:
      path: "${vars.repo_path}"

  get_function_code:
    tool: "modelcontextprotocol-python-sdk.get-code"
    args:
      name: "${vars.target_function}"
      path: "${vars.target_path}"

  find_connections:
    tool: "modelcontextprotocol-python-sdk.find-direct-connections"
    args:
      name: "run_tool"
      path: "mcp_client/executioner.py"

  final_log:
    log: |
      Code analysis complete.
      - Got folder tree for ${vars.repo_path}.
      - Got code for ${vars.target_function}.
      - Found connections for 'run_tool'.
    depends_on:
      - "get_folder_tree"
      - "get_function_code"
      - "find_connections"